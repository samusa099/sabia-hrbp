version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      codeql-components:
        patterns:
          - "github/codeql-action/*"
    ignore:
      # v2+ switches this workflow from GitHub Models to Copilot CLI and
      # requires a separate installation/authentication migration.
      - dependency-name: "actions/ai-inference"
        update-types:
          - "version-update:semver-major"
